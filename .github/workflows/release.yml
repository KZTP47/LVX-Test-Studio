name: Signed Windows release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-candidate:
    runs-on: windows-2022
    environment: release-signing
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: npm ci
      - run: npm run setup
      - run: node scripts/dependency-check.cjs
      - run: node scripts/check-vendor.cjs
      - run: python -m pip install --target .external/python-test-packages --requirement tests/requirements.txt
      - run: node services/execution/prepare-native-fixtures.cjs
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:roadmap
      - run: npm run test:machina
      - run: npm run test:agent-style
      - run: npm run test:agent-board
      - run: node scripts/coordination-e2e.cjs
      - run: node scripts/node-config-style-e2e.cjs
      - name: Require configured signing identity
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw 'Configure the protected release-signing environment first.' }
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
      - run: node scripts/seal-candidate.cjs
      - run: node scripts/release-checksums.cjs --require-signed
      - run: npm run verify:desktop
      - run: node scripts/roadmap-e2e.cjs --packaged
      - run: node scripts/machina-e2e.cjs --packaged
      - run: node scripts/agent-style-e2e.cjs --packaged
      - run: node scripts/agent-studio-e2e.cjs --packaged
      - run: node scripts/coordination-e2e.cjs --packaged
      - run: node scripts/node-config-style-e2e.cjs --packaged
      - run: npm run test:installer
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          retention-days: 30
